version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: github-tracker-postgres
    environment:
      POSTGRES_DB: github_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - github-tracker-net

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: github-tracker-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - github-tracker-net

  # NestJS Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-tracker-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: github_tracker
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_APP_ID: ${GITHUB_APP_ID:-1}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-placeholder}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-secret-change-in-production}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-1}
      JWT_SECRET: ${JWT_SECRET:-472838f1f2f3643015f92373d2b28b0a14adcd7255341189713571fec18abe5f588d1ac278da4150735711d0ba4fa70f81f0d95ffd9b8a9af9bb18984b654ab0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    networks:
      - github-tracker-net
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/metrics/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: github-tracker-frontend
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - github-tracker-net
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  github-tracker-net:
    driver: bridge
